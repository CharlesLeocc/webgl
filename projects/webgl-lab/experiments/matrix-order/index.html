<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 3 | Matrix order</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f3f0e6;
      --muted: #b5c7cb;
      --stroke: #476066;
      --accent: #f6c376;
      background: radial-gradient(ellipse at top right, #2b4849, #132025 65%);
      color: var(--text);
      font: 16px/1.45 Georgia, "Microsoft YaHei", serif;
      min-height: 100%;
    }
    body { margin: 0; }
    main { margin: auto; max-width: 64rem; padding: clamp(1rem, 4vw, 2.5rem); }
    h1 { font-size: clamp(2rem, 6vw, 3.7rem); margin: .25rem 0; line-height: 1.1; }
    header p, #status { color: var(--muted); }
    .kicker, code, output, .axes { font-family: Consolas, monospace; }
    .kicker { color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
    fieldset, figure { border: 1px solid var(--stroke); margin: 1rem 0; padding: 0; min-width: 0; }
    fieldset { display: flex; flex-wrap: wrap; align-items: start; gap: .75rem 1rem; padding: .75rem; }
    label { display: grid; gap: .25rem; }
    input { max-width: 100%; accent-color: var(--accent); }
    select { color: var(--text); background: #20343a; border: 1px solid var(--stroke); font: inherit; }
    canvas { display: block; width: 100%; aspect-ratio: 2.85; background: #111d22; }
    .readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .readouts > div { padding: .65rem .8rem; border-top: 1px solid var(--stroke); }
    .readouts > div + div { border-left: 1px solid var(--stroke); }
    .readouts strong, .readouts output { display: block; }
    .readouts output { color: var(--accent); }
    .axes span { margin-right: .8rem; }
    @media (max-width: 38rem) { canvas { aspect-ratio: 1.8; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="kicker">Week 03 / Transform laboratory</div>
      <h1>Same cube. Different order.</h1>
      <p>Predict both centers first. Then change the angle, translation, or scale and compare the two views.</p>
    </header>
    <fieldset id="controls" disabled>
      <legend>Shared inputs</legend>
      <label>Translate along +X: <output id="distance-value" for="distance">1.0</output>
        <input id="distance" type="range" min="0" max="1.5" step="0.1" value="1">
      </label>
      <label>Rotation: <output id="angle-value" for="angle">90&deg;</output>
        <input id="angle" type="range" min="-180" max="180" step="5" value="90">
      </label>
      <label>Scale local X: <output id="stretch-value" for="stretch">1.0</output>
        <input id="stretch" type="range" min="0.5" max="1.8" step="0.1" value="1">
      </label>
      <label>Rotation axis
        <select id="axis"><option>Z</option><option>Y</option><option>X</option></select>
      </label>
    </fieldset>
    <figure>
      <canvas id="scene" width="960" height="336" aria-label="Two identical cubes given different model transform orders"></canvas>
      <figcaption class="readouts">
        <div><strong>Scale, rotate, then translate</strong><code>T &times; R &times; S</code><output id="trs">-</output></div>
        <div><strong>Scale, translate, then rotate</strong><code>R &times; T &times; S</code><output id="rts">-</output></div>
      </figcaption>
    </figure>
    <p class="axes"><span style="color:#f88170">+X</span><span style="color:#82d8a5">+Y</span><span style="color:#7fb8ff">+Z</span> Center readouts are world (x, y, z).</p>
    <p id="status" role="status">Starting WebGL...</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
