<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 1 | WebGL pipeline check</title>
  <style>
    canvas { display: block; max-width: 100%; height: auto; border: 1px solid; }
  </style>
</head>
<body>
  <main>
    <h1>WebGL pipeline check</h1>
    <p id="status" role="status">Starting WebGL...</p>
    <canvas id="canvas" width="480" height="360"></canvas>
    <p>
      <label for="brightness">Brightness</label>
      <input id="brightness" type="range" min="0" max="1" step="0.1" value="1">
      <output id="brightness-value" for="brightness">1</output>
    </p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
