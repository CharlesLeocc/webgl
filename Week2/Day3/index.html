<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第2周 Day3 - 索引缓冲 EBO</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #glCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px;
      line-height: 1.45;
      max-width: 620px;
    }

    .panel p {
      margin: 4px 0;
    }

    #sideButtons {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    #sideButtons button {
      padding: 5px 9px;
      font-size: 12px;
      color: #e6edf3;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      cursor: pointer;
    }

    #sideButtons button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    #sideButtons button.active {
      background: #2f81f7;
      border-color: #2f81f7;
      color: #fff;
    }

    .ok {
      color: #3fb950;
    }

    .err {
      color: #ff7b72;
    }
  </style>
</head>
<body>
  <!-- 第2周 Day3 学习目标：索引缓冲 EBO
    左半屏：矩形 = 4 个顶点 + 6 个索引（对角顶点复用），drawElements。
    右半屏：正多边形 = 中心 + 环上顶点 + 索引（扇形三角剖分），中心点被反复复用。
  -->
  <canvas id="glCanvas"></canvas>
  <div class="panel">
    <p><strong>第2周 Day3 目标：</strong>索引缓冲 EBO（ELEMENT_ARRAY_BUFFER / drawElements / 顶点复用）</p>
    <p id="statusText">状态：初始化中...</p>
    <p id="tipText">提示：左=矩形（4 顶点/6 索引），右=多边形。点击按钮改变多边形边数，观察顶点数与索引数。</p>
    <div id="sideButtons"></div>
  </div>
  <!-- main.js 使用 import（复用 ../../shared/gl-utils.js），需 type="module" + http 打开 -->
  <script type="module" src="./main.js"></script>
</body>
</html>
