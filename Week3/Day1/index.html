<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week3 Day1：GLSL 数据类型</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #050508;
      color: #e8e8e8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #glCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      max-width: 420px;
      padding: 14px 18px;
      background: rgba(20, 24, 36, 0.92);
      border: 1px solid rgba(120, 140, 200, 0.3);
      border-radius: 10px;
      pointer-events: none;
      line-height: 1.6;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #8ec5ff;
    }
    .mode-name {
      font-weight: bold;
      color: #ffd166;
      font-size: 16px;
    }
    .code {
      display: block;
      margin: 8px 0;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.45);
      border-left: 3px solid #8ec5ff;
      border-radius: 4px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      color: #aaddff;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .hint {
      margin-top: 10px;
      font-size: 13px;
      color: #9ca3af;
    }
    kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid #5b6370;
      border-radius: 4px;
      background: #1f2937;
      font-family: monospace;
      font-size: 12px;
      color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="glCanvas"></canvas>

  <div id="hud">
    <h1>Week3 Day1：GLSL 数据类型</h1>
    <div class="mode-name" id="modeName">1 · vec2 分量访问</div>
    <div class="code" id="modeCode">gl_FragColor = vec4(v_uv, 0.0, 1.0);</div>
    <div id="modeDesc">用 vec2 的 xy 分量填充颜色的 rg，b 通道设为 0。</div>
    <div class="hint">
      <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> <kbd>5</kbd> <kbd>6</kbd> 切换类型展示 ·
      <kbd>空格</kbd> 重置旋转 · <kbd>P</kbd> 暂停/继续
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
